name: Bug report
description: Tell us what went wrong in Corion.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: "Please redact personal data. Do not upload passwords, cookies, tokens or raw browser profile files."
  - type: input
    id: version
    attributes:
      label: Corion version
      description: Find the version in Settings -> About.
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Redacted screenshot or recording (optional)
